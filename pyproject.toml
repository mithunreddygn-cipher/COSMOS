[project]
name = "cosmos"
version = "0.1.0"
description = "Evidence-driven SPHEREx exploration and investigation platform"
requires-python = ">=3.11,<3.12"
dependencies = [
  "astropy>=6.1,<8",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
science = ["photutils>=1.13,<3", "scipy>=1.13,<2", "plotly>=5.24,<7"]
test = ["pytest>=8,<10"]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pystac-client>=0.8,<1",
  "planetary-computer>=1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["ingest*", "quality*", "gate*", "science*", "detect*", "investigate*", "report*", "ui*", "api*", "external_data*"]
